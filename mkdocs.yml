site_name: Pourpoint and HFX
site_url: https://pourpoint-tools.github.io/
docs_dir: .docs-build/docs
site_dir: .docs-build/site
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 2
            show_signature_annotations: true
            members_order: source
            inherited_members: true
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - pymdownx.superfences
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - Pourpoint:
      - Overview: index.md
      - Getting started: getting-started.md
      - Concepts: concepts.md
      - Operations: operations.md
      - Runtime access: runtime.md
      - Native rasters: rasters.md
  - API reference:
      - Core operations: reference/operations.md
      - Returned objects: reference/results.md
      - Advanced source access: reference/source.md
  - HFX:
      - Overview: hfx/index.md
      - Data model: hfx/data-model.md
      - Bundle discovery: hfx/bundle.md
      - Feature schemas: hfx/vector-data.md
      - Spatial access: hfx/spatial-layout.md
      - Native rasters: hfx/raster-data.md
