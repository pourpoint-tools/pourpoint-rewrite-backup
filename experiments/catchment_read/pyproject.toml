[project]
name = "pourpoint-catchment-read-experiment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyarrow==25.0.1",
    "numpy>=2",
    "shapely>=2",
    "psutil>=7",
    "httpx>=0.28.1",
    "flatbuffers>=25.12.19",
    "botocore>=1.43.109",
]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "ty>=0.0.1a20"]
[tool.ruff]
target-version = "py313"
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ty.src]
include = ["*.py"]
