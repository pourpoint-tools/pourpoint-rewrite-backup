[project]
name = "hfx-dense-topology-experiment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "pyarrow>=19", "psutil>=7", "scipy>=1.15"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "ty>=0.0.1"]
[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
pythonpath = ["."]
