[project]
name = "arrow-read-experiment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["numpy>=2.2", "pyarrow>=19", "psutil>=7", "boto3>=1.35"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "ty>=0.0.35"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.per-file-ignores]
"read_graph.py" = ["E402"] # Deliberately time dependency imports.
[tool.pytest.ini_options]
pythonpath = ["."]
